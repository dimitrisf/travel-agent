name: Unit tests

# Runs the Vitest suite on every push and every PR. No secrets, no
# database, no OpenAI budget — just pure-logic + mocked-repo tests
# from Stage 23 (Phases 1 and 2). Fast enough (~seconds) that there's
# no reason to gate on draft PRs, unlike the eval suite in evals.yml.
#
# When Phase 2b lands (repository tests against a real Prisma DB),
# this workflow will gain a Neon test-branch DATABASE_URL secret and a
# `prisma migrate deploy` step — but that's a future extension, not a
# rewrite.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Per-branch: iterative pushes on the same branch cancel earlier
  # runs. Parallel branches (different features) still run concurrently.
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Unit tests are pure logic — no LLM calls, no DB, no MCP. A very
    # generous cap so a hung test still fails loudly.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `prisma generate` is needed even though tests don't hit the DB
      # because @prisma/client types get referenced through the
      # repository/service layers at typecheck / test-import time. Skip
      # this and the test files that import repository types fail to
      # load.
      - name: Prisma generate
        run: npx prisma generate

      - name: Run unit tests
        run: npm test
